{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm p-4 text-center">
            <h2 class="fw-bold text-dark mb-1">Interview Performance Scorecard</h2>
            <p class="text-muted mb-4">Here is the evaluation generated by Gemini AI based on your responses.</p>
            
            <!-- Score Display -->
            <div class="my-3 p-3 bg-light rounded d-inline-block mx-auto border">
                <span class="display-3 fw-bold text-primary">{{ score }}</span>
                <span class="fs-4 text-muted">/ 100</span>
            </div>

            <!-- Detailed AI Feedback -->
            <div class="text-start bg-white p-4 border rounded my-4">
                <h5 class="fw-bold text-secondary mb-3">📋 AI Feedback & Performance Critique</h5>
                <p class="text-dark lh-base mb-0" style="white-space: pre-line;">{{ feedback }}</p>
            </div>

            <!-- Action Buttons -->
            <div class="d-flex justify-content-center gap-3">
                <a href="/" class="btn btn-outline-primary px-4 py-2 fw-semibold">Take Another Test</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
